name: Oracle Free Tier ARM Instance Claimer

# Put this file at .github/workflows/oci-claim.yml
# Put oci_claim.py in the repo root.

on:
  schedule:
    - cron: '*/20 * * * *'   # re-queues itself; concurrency below prevents overlap
  workflow_dispatch:

# Only one claimer runs at a time; a second one waits instead of cancelling.
concurrency:
  group: oci-claim
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets the job disable this workflow after success

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # Python stops itself at ~340 min, then the next run takes over

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OCI SDK
        run: pip install --quiet oci

      - name: Claim instance
        id: claim
        env:
          # --- required secrets ---
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          # --- optional secrets (leave unset to use defaults) ---
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}  # unset = try all ADs
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}                        # unset = auto-pick latest Ubuntu ARM
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}            # unset = tenancy root
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # --- optional repo variables (Settings > Variables) ---
          OCI_OCPUS: ${{ vars.OCI_OCPUS }}                      # default 2 (Always Free = 2 OCPU)
          OCI_MEMORY_GB: ${{ vars.OCI_MEMORY_GB }}              # default 12 (Always Free = 12 GB)
          OCI_BOOT_GB: ${{ vars.OCI_BOOT_GB }}                  # default 200
          OCI_UBUNTU_VERSION: ${{ vars.OCI_UBUNTU_VERSION }}    # default 24.04
          OCI_INSTANCE_NAME: ${{ vars.OCI_INSTANCE_NAME }}      # default minecraft-server
          ALLOW_PAID_SIZE: ${{ vars.ALLOW_PAID_SIZE }}          # leave unset: blocks sizes above the free allowance
          RETRY_SECONDS: ${{ vars.RETRY_SECONDS }}              # default 60
          MAX_RUNTIME_SECONDS: ${{ vars.MAX_RUNTIME_SECONDS }}  # default 20400
        run: python oci_claim.py

      # Off by default. Artifacts in PUBLIC repos can be downloaded by anyone.
      # Set repo variable SAVE_ARTIFACT=true only if the repo is private.
      - name: Upload instance details
        if: always() && steps.claim.outputs.status == 'created' && vars.SAVE_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ORACLE-INSTANCE-FILES
          path: instance-details.txt
          retention-days: 90

      # Stop re-running once we have the server (or one already exists).
      - name: Disable this workflow
        if: always() && (steps.claim.outputs.status == 'created' || steps.claim.outputs.status == 'exists')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable oci-claim.yml --repo "$GITHUB_REPOSITORY"
